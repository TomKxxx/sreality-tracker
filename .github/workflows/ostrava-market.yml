name: Ostrava sale & rent market history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market_tracker.py'
      - '_config.yml'
      - 'extra_sources.py'
      - 'requirements-market.txt'
      - '.github/workflows/ostrava-market.yml'
  schedule:
    # UTC schedules cover BST/GMT plus a fallback if GitHub drops the first event.
    # The freshness gate below prevents repeat scans on the same Prague day.
    - cron: '13 9 * * *'
    - cron: '13 10 * * *'
    - cron: '13 11 * * *'

permissions:
  contents: write

concurrency:
  group: ostrava-property-history
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check due time and existing daily observations
        id: timecheck
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, urllib.request
          from zoneinfo import ZoneInfo
          event = os.environ["GITHUB_EVENT_NAME"]
          if event != "schedule":
              print("scan=true")
              raise SystemExit(0)
          now = datetime.datetime.now(ZoneInfo("Europe/London"))
          if (now.hour, now.minute) < (10, 13):
              print("scan=false")
              raise SystemExit(0)
          today = datetime.datetime.now(ZoneInfo("Europe/Prague")).date().isoformat()
          fresh = True
          for market in ("sale", "rent"):
              url = f"https://api.github.com/repos/TomKxxx/sreality-tracker/contents/data/{market}/latest.json"
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github.raw+json",
                  "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      payload = json.load(response)
                  observed = datetime.datetime.fromisoformat(payload["observed_at"])
                  fresh &= (payload.get("date") == today
                            and observed.astimezone(ZoneInfo("Europe/Prague")).date().isoformat() == today
                            and payload.get("status") == "ok")
              except Exception as exc:
                  print(f"Freshness check failed for {market}: {exc}", file=__import__("sys").stderr)
                  fresh = False
          print("scan=false" if fresh else "scan=true")
          PY
      - uses: actions/checkout@v4
        if: steps.timecheck.outputs.scan == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.scan == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-market.txt
      - name: Install dependencies
        if: steps.timecheck.outputs.scan == 'true'
        run: python -m pip install -r requirements-market.txt
      - name: Run automated tests
        if: steps.timecheck.outputs.scan == 'true'
        run: python -m unittest discover -s tests -v
      - name: Diagnose photo CDN responses
        if: steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import urlsplit
          import json
          records=json.load(open("data/sale/current.json",encoding="utf-8"))
          img=next((r.get("image_url") for r in records.values() if r.get("image_url")),None)
          if not img:
              print("No sample photo URL stored");raise SystemExit(0)
          variants=[("original",img),("resized",img.split("?")[0]+"?fl=res,400,300,3|shr,,20|jpg,90")]
          for label,url in variants:
              for referer in ("", "https://www.sreality.cz/"):
                  try:
                      headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"}
                      if referer: headers["Referer"]=referer
                      r=requests.get(url,headers=headers,timeout=12,stream=True)
                      print("photo probe",label,"referer",bool(referer),"HTTP",r.status_code,"type",r.headers.get("Content-Type"),"host",urlsplit(url).hostname,"length",r.headers.get("Content-Length"))
                      r.close()
                  except requests.RequestException as e:
                      print("photo probe",label,type(e).__name__,str(e)[:150])
          PY
      - name: Scan both markets (sale and rent)
        if: steps.timecheck.outputs.scan == 'true'
        env:
          EXTRA_SOURCES: '1'
          ARCHIVE_IMAGES: '1'
        run: python market_tracker.py --market both
      - name: Verify today's separate sale and rental outputs
        if: steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json
          today = datetime.now(ZoneInfo("Europe/Prague")).date().isoformat()
          for market in ("sale", "rent"):
              folder = Path("data") / market
              latest = json.loads((folder / "latest.json").read_text(encoding="utf-8"))
              assert latest["date"] == today, f"{market}: stale scan date"
              assert latest["market"] == market, f"{market}: wrong market"
              assert latest["status"] == "ok", f"{market}: scan not OK"
              assert latest["classification_version"] == 2, f"{market}: old classifier"
              assert latest["inventory"] > 0, f"{market}: empty/unverified inventory"
              assert (folder / "history.json").is_file()
              assert (folder / "history.csv").is_file()
              assert (folder / "daily" / (today + ".json")).is_file()
              assert (Path("reports") / market / (today + ".html")).is_file()
              print(f"Verified {market}: {latest['inventory']} adverts at {latest['observed_at']}")
          PY
      - name: Save daily snapshots and separate reports
        if: success() && steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data reports assets/photos; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Daily Ostrava property data $(TZ=Europe/Prague date +%F)"
            # Rebase scanner output onto new commits made while scanning.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Rebase conflict; refusing to discard remote changes."
                exit 1
              fi
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          else
            echo "No new observations to commit"
          fi
