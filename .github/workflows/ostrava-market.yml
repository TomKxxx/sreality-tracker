name: Ostrava sale & rent market history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'market_tracker.py'
      - '_config.yml'
      - 'extra_sources.py'
      - 'requirements-market.txt'
      - '.github/workflows/ostrava-market.yml'
  schedule:
    # GitHub supports IANA timezones. Offset from :00 to avoid peak-time queue drops.
    # Delayed scheduled runs must still execute, never silently skip by wall-clock.
    - cron: '13 10 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write

concurrency:
  group: ostrava-property-history
  cancel-in-progress: true

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check valid trigger
        id: timecheck
        shell: bash
        run: |
          # A delayed schedule event is still today's due scan; do not inspect
          # the worker's current hour, which silently skipped earlier runs.
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|push|schedule) echo "scan=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "scan=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.timecheck.outputs.scan == 'true'
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        if: steps.timecheck.outputs.scan == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-market.txt
      - name: Install dependencies
        if: steps.timecheck.outputs.scan == 'true'
        run: python -m pip install -r requirements-market.txt
      - name: Run automated tests
        if: steps.timecheck.outputs.scan == 'true'
        run: python -m unittest discover -s tests -v
      - name: Diagnose photo CDN responses
        if: steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import urlsplit
          import json
          records=json.load(open("data/sale/current.json",encoding="utf-8"))
          img=next((r.get("image_url") for r in records.values() if r.get("image_url")),None)
          if not img:
              print("No sample photo URL stored");raise SystemExit(0)
          variants=[("original",img),("resized",img.split("?")[0]+"?fl=res,400,300,3|shr,,20|jpg,90")]
          for label,url in variants:
              for referer in ("", "https://www.sreality.cz/"):
                  try:
                      headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"}
                      if referer: headers["Referer"]=referer
                      r=requests.get(url,headers=headers,timeout=12,stream=True)
                      print("photo probe",label,"referer",bool(referer),"HTTP",r.status_code,"type",r.headers.get("Content-Type"),"host",urlsplit(url).hostname,"length",r.headers.get("Content-Length"))
                      r.close()
                  except requests.RequestException as e:
                      print("photo probe",label,type(e).__name__,str(e)[:150])
          PY
      - name: Scan both markets (sale and rent)
        if: steps.timecheck.outputs.scan == 'true'
        env:
          EXTRA_SOURCES: '1'
          ARCHIVE_IMAGES: '1'
        run: python market_tracker.py --market both
      - name: Verify today's separate sale and rental outputs
        if: steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json
          today = datetime.now(ZoneInfo("Europe/Prague")).date().isoformat()
          for market in ("sale", "rent"):
              folder = Path("data") / market
              latest = json.loads((folder / "latest.json").read_text(encoding="utf-8"))
              assert latest["date"] == today, f"{market}: stale scan date"
              assert latest["market"] == market, f"{market}: wrong market"
              assert latest["status"] == "ok", f"{market}: scan not OK"
              assert latest["classification_version"] == 2, f"{market}: old classifier"
              assert latest["inventory"] > 0, f"{market}: empty/unverified inventory"
              assert (folder / "history.json").is_file()
              assert (folder / "history.csv").is_file()
              assert (folder / "daily" / (today + ".json")).is_file()
              assert (Path("reports") / market / (today + ".html")).is_file()
              print(f"Verified {market}: {latest['inventory']} adverts at {latest['observed_at']}")
          PY
      - name: Save daily snapshots and separate reports
        if: always() && steps.timecheck.outputs.scan == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in data reports assets/photos; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Daily Ostrava property data $(TZ=Europe/Prague date +%F)"
            # Rebase scanner output onto new commits made while scanning.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "Rebase conflict; refusing to discard remote changes."
                exit 1
              fi
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          else
            echo "No new observations to commit"
          fi
